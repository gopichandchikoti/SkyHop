<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img"
  aria-labelledby="title desc">
  <title id="title">SkyHop</title>
  <desc id="desc">A coral bird flaps between green pipes under drifting clouds.</desc>
  <style>
    .cloud { animation: drift 38s linear infinite; }
    .c2 { animation-duration: 52s; animation-delay: -20s; }
    .c3 { animation-duration: 45s; animation-delay: -33s; }
    .pipes { animation: scroll 8s linear infinite; }
    .pipes2 { animation-delay: -4s; }
    .bob { animation: bob 1.7s ease-in-out infinite; }
    .wing { transform-origin: 40px 56px; animation: flap 0.46s ease-in-out infinite alternate; }
    @keyframes drift { from { translate: -260px 0; } to { translate: 1240px 0; } }
    @keyframes scroll { from { translate: 0 0; } to { translate: -1000px 0; } }
    @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-9px) rotate(3deg); } }
    @keyframes flap { from { transform: rotate(10deg); } to { transform: rotate(-26deg); } }
    @media (prefers-reduced-motion: reduce) { .cloud, .pipes, .bob, .wing { animation: none; } }
  </style>
  <defs>
    <linearGradient id="bannerSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fb2ff"/><stop offset="1" stop-color="#c9ecff"/>
    </linearGradient>
    <radialGradient id="bannerSun"><stop offset="0.4" stop-color="#fff6c8"/><stop offset="1" stop-color="#fff6c8" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="960" height="280" fill="url(#bannerSky)"/>
  <circle cx="800" cy="70" r="70" fill="url(#bannerSun)"/><circle cx="800" cy="70" r="30" fill="#fff1b8"/>
  <g class="cloud c1" style="transform:translate(140px,60px) scale(1)" fill="#fff" opacity="0.93"><ellipse cx="0" cy="0" rx="46" ry="14"/><ellipse cx="22" cy="-12" rx="26" ry="18"/><ellipse cx="-20" cy="-8" rx="20" ry="14"/></g><g class="cloud c2" style="transform:translate(520px,40px) scale(0.8)" fill="#fff" opacity="0.93"><ellipse cx="0" cy="0" rx="46" ry="14"/><ellipse cx="22" cy="-12" rx="26" ry="18"/><ellipse cx="-20" cy="-8" rx="20" ry="14"/></g><g class="cloud c3" style="transform:translate(760px,120px) scale(1.1)" fill="#fff" opacity="0.93"><ellipse cx="0" cy="0" rx="46" ry="14"/><ellipse cx="22" cy="-12" rx="26" ry="18"/><ellipse cx="-20" cy="-8" rx="20" ry="14"/></g>
  <path d="M0 232 Q200 190 420 226 T960 214 V280 H0 Z" fill="#9bd6c6"/>
  <path d="M0 256 Q260 232 520 254 T960 248 V280 H0 Z" fill="#86e05a"/>
  <g class="pipes" style="transform:translateX(560px)"><rect x="0" y="-10" width="72" height="102" rx="5" fill="#4ccd5e" stroke="#1b1f3b" stroke-width="4"/><rect x="10" y="-10" width="9" height="102" fill="#8af08c" opacity="0.7"/><rect x="-8" y="70" width="88" height="24" rx="6" fill="#4ccd5e" stroke="#1b1f3b" stroke-width="4"/><rect x="0" y="192" width="72" height="100" rx="5" fill="#4ccd5e" stroke="#1b1f3b" stroke-width="4"/><rect x="10" y="192" width="9" height="100" fill="#8af08c" opacity="0.7"/><rect x="-8" y="190" width="88" height="24" rx="6" fill="#4ccd5e" stroke="#1b1f3b" stroke-width="4"/></g><g class="pipes pipes2" style="transform:translateX(560px)"><rect x="0" y="-10" width="72" height="102" rx="5" fill="#4ccd5e" stroke="#1b1f3b" stroke-width="4"/><rect x="10" y="-10" width="9" height="102" fill="#8af08c" opacity="0.7"/><rect x="-8" y="70" width="88" height="24" rx="6" fill="#4ccd5e" stroke="#1b1f3b" stroke-width="4"/><rect x="0" y="192" width="72" height="100" rx="5" fill="#4ccd5e" stroke="#1b1f3b" stroke-width="4"/><rect x="10" y="192" width="9" height="100" fill="#8af08c" opacity="0.7"/><rect x="-8" y="190" width="88" height="24" rx="6" fill="#4ccd5e" stroke="#1b1f3b" stroke-width="4"/></g>
  <g transform="translate(110 45) scale(1.7)"><g class="bob">
  <g stroke="#1b1f3b" stroke-linejoin="round" stroke-linecap="round">
    <defs>
      <linearGradient id="tail" gradientUnits="userSpaceOnUse" x1="19" y1="0" x2="34" y2="0">
        <stop offset="0.42" stop-color="#2ec4b6"/><stop offset="0.42" stop-color="#ff5c3a"/>
      </linearGradient>
    </defs>
    <path d="M50 35 L47 24 L53 31 L55 22 L58 32 L62 25 L61 37 Z" fill="#2ec4b6" stroke-width="2.6"/>
    <path d="M34 49 L22 43 L27 53 L20 57 L27 61 L22 70 L34 64 Z" fill="url(#tail)" stroke-width="3"/>
    <circle cx="53" cy="56" r="23" fill="#ff7a59" stroke-width="3.5"/>
    <ellipse cx="51" cy="65" rx="12" ry="6.5" fill="#ffe0c2" stroke="none"/>
    <g class="wing"><path d="M36 54 C40 44 56 46 58 58 C52 66 40 66 36 54 Z" fill="#ff5c3a" stroke-width="3"/></g>
    <circle cx="67" cy="60" r="3.6" fill="#ff8fa3" stroke="none" opacity="0.9"/>
    <circle cx="63" cy="49" r="7.5" fill="#fff" stroke-width="2.5"/>
    <circle cx="65.5" cy="49" r="3.4" fill="#14172b" stroke="none"/>
    <path d="M74 55 L88 59 L74 64 Z" fill="#ffb703" stroke-width="3"/>
  </g></g></g>
</svg>
