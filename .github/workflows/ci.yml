name: SkyHop CI

on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - name: Audit shipped dependencies
        run: npm audit --omit=dev
      - run: npm run build
      - name: Browser end-to-end checks (production build)
        run: |
          npx vite preview --port 5605 &
          curl --retry 15 --retry-connrefused --retry-delay 1 -s -o /dev/null http://localhost:5605/
          SKYHOP_PROD=1 npm run test:e2e
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/e2e/output
